# Local development and a small single-machine deployment: the API and its
# Postgres. Put an HTTPS reverse proxy (Caddy, nginx, the host's load
# balancer) in front of port 8000 before a phone talks to it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stepbound
      POSTGRES_PASSWORD: stepbound
      POSTGRES_DB: stepbound
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stepbound"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://stepbound:stepbound@db:5432/stepbound
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
